name: CI

on:
  push:
  pull_request:
    branches: [develop, staging, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Reject private files and recognized credentials
        run: python3 tools/check_repository.py --history
      - name: Unit and HTTP boundary tests
        run: python3 -m unittest discover -s tests -v
      - name: Syntax and whitespace
        run: |
          python3 -m compileall -q picklequeue tests tools
          node --check web/app.js
          node --check tests/browser-smoke.cjs
          git diff --check HEAD^ HEAD
      - name: Check contribution and promotion policy
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: python3 tools/check_pull_request.py
